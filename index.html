<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17352d" />
  <title>IT Kitchen — HOD Update</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="presentation-locked">
  <div class="start-screen" id="startScreen" role="dialog" aria-modal="true" aria-label="Start presentation">
    <div class="start-kitchen-card">
      <div class="start-sign">MOUNTAIN TORQ · IT KITCHEN</div>
      <div class="start-cloche" aria-hidden="true">🍽️</div>
      <button class="start-presentation-btn" id="startPresentation" type="button">
        <span>OPEN THE IT KITCHEN</span>
        <small>Today's HOD service is ready</small>
      </button>
    </div>
  </div>

  <div class="table-prop prop-lemon" aria-hidden="true">🍋</div>
  <div class="table-prop prop-leaf" aria-hidden="true">🌿</div>
  <div class="table-prop prop-napkin" aria-hidden="true"></div>

  <div class="deck-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-block">
        <div class="brand-mark">👨‍🍳</div>
        <div>
          <p class="brand-kicker">IT Kitchen</p>
          <h1 id="deckTitleSide">IT Update</h1>
        </div>
      </div>

      <div class="sidebar-note">Fresh updates.<br><strong>Served clearly.</strong> 🍽️</div>

      <nav id="slideNav" class="slide-nav" aria-label="Slide navigation"></nav>

      <div class="sidebar-footer">
        <span id="preparedBy"></span>
        <span id="reportDate"></span>
      </div>
    </aside>

    <main class="presentation">
      <div class="topbar">
        <button class="icon-btn" id="toggleSidebar" title="Toggle menu">☰ Menu</button>
        <div class="progress-wrap">
          <span class="progress-label">Service progress</span>
          <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        </div>
        <div class="slide-count"><span id="currentSlide">1</span>/<span id="totalSlides">1</span></div>
        <button class="sound-btn" id="soundToggle" type="button" aria-pressed="true" title="Turn presentation sounds on or off">🔊 Sound On</button>
        <button class="ghost-btn" onclick="window.print()">🧾 Print / PDF</button>
      </div>

      <section id="slideStage" class="slide-stage" aria-live="polite"></section>

      <div class="controls">
        <button id="prevBtn" class="control-btn">← Previous course</button>
        <button id="nextBtn" class="control-btn primary">Next course →</button>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
